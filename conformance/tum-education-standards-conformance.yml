- standard: datacite
  detail: >-
    api.datacite.org/providers and /clients queries for "Munich" and "tum" returned zero rows
    (200, meta.total 0). mediaTUM mints URN:NBN identifiers through the Deutsche Nationalbibliothek
    (epicur / xMetaDissPlus prefixes above), not DataCite DOIs, so no DataCite conformance is claimed.
- standard: crossref
