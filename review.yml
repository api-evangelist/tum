reviews:
  - date: '2026-06-03'
    rating: 3
    summary: >-
      TUM has no single central commercial developer portal. Its public API
      footprint is real but community/student-driven via the TUM-Dev GitHub
      organization. I verified NavigaTUM's live /api/search endpoint returns
      JSON without auth, and eat-api serves live static canteen JSON. The
      Campus-Backend (gRPC) is open source but operated for the apps rather than
      documented for third parties. TUMFIS runs on Elsevier Pure but exposes no
      documented public API. No endpoints were fabricated; the /api/get/{id}
      direct probe returned 404 (path requires a valid resolvable id), so only
      confirmed-working URLs are rated as live.
