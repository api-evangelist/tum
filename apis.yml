x-coverage:
  state: covered
  reason: institution-operated-surfaces
  detail: >-
    TUM is one of the minority of universities in this cohort that genuinely operates machine-readable
    surfaces of its own: two OpenAPI contracts (api.tum.app, nav.tum.de), an OAI-PMH 2.0 responder on
    its own repository, and DFN-AAI-registered SAML metadata. What it does not have is a central developer
    program — no developer portal, no API terms, no key issuance, no changelog, no open data portal
    (data.tum.de and opendata.tum.de do not resolve), and no API named anywhere on www.tum.de. Everything
    catalogued here was built by a student association or is a vendor platform running under a TUM subdomain.
    Two documentation surfaces are published but broken: api.tum.app's Swagger UI points at a swagger.json
    that returns the UI HTML, and TUMonline's Public REST API page is an Angular shell whose bundles
    all 404.
  evidence:
  - url: https://api.tum.app/swagger/swagger.json
    status: 200
  - url: https://nav.tum.de/api/openapi.json
    status: 200
  - url: https://mediatum.ub.tum.de/oai/oai.py?verb=Identify
    status: 200
  - url: https://login.tum.de/idp/shibboleth
    status: 200
  - url: https://campus.tum.de/tumonline/ee/rest/slc.tm.cp/student/courses
    status: 200
  - url: >-
      https://campus.tum.de/tumonline/co/public/sec/auth/realms/CAMPUSonline/.well-known/openid-configuration
    status: 200
  - url: https://api.tum.app/swagger.json
    status: 200
    note: soft 200 — returns the Swagger UI HTML, not a spec
  - url: https://campus.tum.de/tumonline/co/public/api/main.bbddcce1a3e0d240.js
    status: 404
    note: the Public REST API docs SPA cannot boot
  - url: https://mediatum.ub.tum.de/
    status: 200
    note: Anubis proof-of-work bot challenge, not the repository page
  - url: https://www.tum.de/llms.txt
    status: 404
  - url: https://www.tum.de/.well-known/security.txt
    status: 404
  - url: https://data.tum.de/
    status: 0
    note: DNS does not resolve
  - url: https://opendata.tum.de/
    status: 0
    note: DNS does not resolve
  checked: '2026-08-19'
