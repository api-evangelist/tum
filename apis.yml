- aid: tum:identity-federation
  name: TUM Shibboleth Identity Provider (SAML 2.0 Metadata)
  x-operator: institution
  x-operator-basis: >-
    Metadata is served from TUM's own login.tum.de and asserts the tum.de Shibboleth scope with display
    name "Technical University of Munich (TUM)". The instance is hosted for TUM by the Leibniz Supercomputing
    Centre (canonical entityID https://tumidp.lrz.de/idp/shibboleth), but the federated identity being
    asserted is the institution's own and no other institution shares this entity.
  description: >-
    Machine-readable SAML 2.0 identity provider metadata — an EntityDescriptor with an IDPSSODescriptor
    supporting urn:oasis:names:tc:SAML:2.0:protocol, registered in DFN-AAI since 2009-05-26 and reachable
    through eduGAIN. Carries the REFEDS Research & Scholarship entity category and both SIRTFI and SIRTFI2
    assurance certifications. This is the surface every university operates by definition and almost none
    of them get catalogued as an API; it is included here deliberately.
  humanURL: https://www.it.tum.de/en/
  baseURL: https://login.tum.de/idp
