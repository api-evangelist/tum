        url: https://github.com/TUM-Dev/NavigaTUM/blob/main/server/README.md
      - type: GitHub
        url: https://github.com/TUM-Dev/NavigaTUM
      - type: Website
        url: https://nav.tum.de/
  - aid: tum:eat-api
    name: eat-api (Mensa / Canteen API)
    description: >-
      Simple static JSON API for student food places (Mensa/StuBistro) in and
      around Munich, providing daily dish names and prices per canteen, year,
      and ISO week. Served as static JSON files via GitHub Pages and consumed by
      the TUM Campus App.
    humanURL: https://github.com/TUM-Dev/eat-api
    baseURL: https://tum-dev.github.io/eat-api
    tags: [ Food, Mensa, Canteen, Static API, JSON ]
    properties:
      - type: Documentation
        url: https://github.com/TUM-Dev/eat-api
      - type: GitHub
        url: https://github.com/TUM-Dev/eat-api
      - type: Website
        url: https://tum-dev.github.io/eat-api/
  - aid: tum:campus-backend
    name: TUM Campus App Backend (gRPC)
    description: >-
      Backend for the TUM Campus App, written in Go and exposing a gRPC API
      interface used by the official cross-platform (Flutter/Dart) campus
      clients. Source is public; the production endpoint is used by the apps
      rather than offered as an openly documented third-party API.
    humanURL: https://github.com/TUM-Dev/Campus-Backend
    tags: [ Campus, gRPC, Mobile Backend, Go ]
    properties:
