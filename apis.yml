apis:
  - aid: tum:navigatum
    name: NavigaTUM API
    description: >-
      Public API to search for and resolve rooms, buildings, and other places
      across TUM campuses. Written in Rust with a MeiliSearch backend and
      documented via an OpenAPI 3.0 specification. The /api/search endpoint is
      live and returns JSON without authentication.
    humanURL: https://github.com/TUM-Dev/NavigaTUM
    baseURL: https://nav.tum.de/api
    tags: [ Search, Maps, Buildings, Rooms, Campus, OpenAPI ]
    properties:
