- aid: tum:mediatum-oai-pmh
  name: mediaTUM OAI-PMH Repository Interface
  x-operator: institution
  x-operator-basis: >-
    mediaTUM is TUM's own institutional media and publication repository, running on ub.tum.de infrastructure
    the university library operates. The OAI-PMH responder identifies itself as "mediaTUM - The Technische
    Universität München Media Repository" with adminEmail mediatum@ub.tum.de. No vendor repository platform
    is in the path.
  description: >-
    OAI-PMH 2.0 harvesting interface over TUM's institutional repository. Verified verbs Identify, ListMetadataFormats
    and ListSets all answer 200. Metadata prefixes: oai_dc, epicur and xMetaDissPlus (the Deutsche Nationalbibliothek
    dissertation profile). Earliest datestamp 1959-01-01, deletedRecord: no, granularity to the second.
    Note the asymmetry: the machine surface is wide open while the HTML surface at mediatum.ub.tum.de
    sits behind an Anubis proof-of-work anti-scraper challenge — a repository that is more readable to
    a harvester than to a browser.
  humanURL: https://mediatum.ub.tum.de/
  baseURL: https://mediatum.ub.tum.de/oai/oai
