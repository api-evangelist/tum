---
aid: tum
name: Technical University of Munich
description: >-
  The Technical University of Munich (TUM) is a public research university in
  Munich, Germany, ranked #47 in the QS World University Rankings 2025. TUM does
  not operate a single centralized, commercial developer portal; instead its
  most visible public API footprint is community- and student-driven through the
  TUM-Dev open-source organization on GitHub, which builds and operates the
  Campus App ecosystem. Confirmed public, unauthenticated APIs include NavigaTUM
  (a Rust/MeiliSearch service to search rooms, buildings, and places, documented
  with an OpenAPI 3.0 spec) and eat-api (a static JSON API for Munich student
  canteen menus and prices). The institution's central research information
  system, TUMFIS, runs on Elsevier Pure but exposes no documented public API.
