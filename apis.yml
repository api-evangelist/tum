aid: tum
name: Technical University of Munich
x-type: university
x-category: Technical University
description: >-
  The Technical University of Munich (TUM) is a public technical research university in Munich, Germany,
  and one of Germany's eleven Universities of Excellence. Its programmable footprint is real but small,
  and almost none of it comes from a central IT developer program: TUM operates no public developer
  portal, publishes no API terms of service, and lists no API on www.tum.de. What it does operate, verified
  live on 2026-08-19, is four machine-readable surfaces. Two are OpenAPI contracts built and run by
  Open Source @ TUM e.V. (TUM-Dev), a TUM-affiliated association: the TUM Campus App backend at api.tum.app
  (19 operations, Swagger 2.0 generated from tumdev/campus_backend.proto, also served over gRPC at api-grpc.tum.app,
  listed by TUM IT as an official TUM mobile app), and NavigaTUM at nav.tum.de (room, building and campus
  navigation, taken into productive operation by TUM as the official room finder). The other two are
  the surfaces a university operates by definition and rarely catalogues: a SAML 2.0 / Shibboleth identity
  provider publishing DFN-AAI-registered metadata at login.tum.de with SIRTFI2 assurance, and an OAI-PMH
  2.0 endpoint on mediaTUM, TUM's own institutional repository, harvestable back to 1959. Everything
  else is a tenant relationship on someone else's platform: the student information system TUMonline
  runs CAMPUSonline on campus.tum.de (live unauthenticated course REST plus a full OIDC discovery document
  with 108 scopes), the research information system TUMFIS runs Elsevier Pure, and the canteen menu
  API eat-api is static JSON on GitHub Pages carrying Studierendenwerk data. No open data portal exists:
  data.tum.de and opendata.tum.de do not resolve.
